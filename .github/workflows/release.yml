name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Verify Python
        run: |
          uv run python --version

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y imagemagick jq ruby-dev build-essential
      - name: Install fpm
        run: sudo gem install fpm -v 1.17.0

      - name: Sync dev environment
        run: |
          uv sync --locked --extra dev
          uv pip install -e tests/fixtures/ordine_test_plugin

      - name: Lint and typecheck
        run: uv run ruff check . && uv run ruff format --check . && uv run mypy

      - name: Test
        run: uv run pytest -m "not llm_live"

      - name: Assert tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(uv run python -c 'import ordine; print(ordine.__version__)')"
          test "${TAG}" = "${PKG}"

      - name: Build distributions
        run: uv build

      - name: Build deb from tested wheel and lock
        run: bash scripts/build_deb.sh

      - name: Extract changelog section
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          uv run python scripts/extract_changelog.py "${TAG}" CHANGELOG.md > release-notes.md

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --draft --title "${TAG}" --notes-file release-notes.md
            gh release upload "${TAG}" --clobber dist/*.whl dist/*.tar.gz deb-dist/*.deb
          else
            gh release create "${TAG}" \
              --draft \
              --title "${TAG}" \
              --notes-file release-notes.md \
              dist/*.whl dist/*.tar.gz deb-dist/*.deb
          fi

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
          skip-existing: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false
